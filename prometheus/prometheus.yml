global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "agent-mesh-backend"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "backend"

  - job_name: "agent-mesh-worker"
    metrics_path: /api/v1/metrics
    static_configs:
      - targets: ["host.docker.internal:8001"]
        labels:
          service: "worker"
